services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: nafahat:latest
    container_name: nafahat-app

    expose:
      - "3000"

    env_file:
      - .env

    environment:
      - MONGO_URL=mongodb://mongo:27017/nafahat

    depends_on:
      - mongo

    volumes:
      - nafahat-uploads:/app/public/uploads

    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nafahat-nginx

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - app

    restart: unless-stopped

  mongo:
    image: mongo:latest
    container_name: nafahat-mongo

    volumes:
      - nafahat-mongodb:/data/db

    restart: unless-stopped


volumes:
  nafahat-mongodb:
  nafahat-uploads: